model:
  plugin: EFTFit.Fitter.EFTModel:eftmodel
  options: []
parameterization:
  option: fits
  source: ../../Fitter/hist_files/synthetic_parameterization.npy
build:
  channel_masks: true
  allow_no_background: false
output:
  workspace: ../../Fitter/test/synthetic_workspace.root
